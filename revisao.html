<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisão para prova</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" defer></script>
<link rel="stylesheet" href="assets/estudo.css">
</head>
<body>
<main class="site">
  <nav class="site-nav"><a class="btn pequeno" href="index.html">← Início do livro</a></nav>
  <h1>Revisão para prova</h1>
  <p class="sub">Questões de vários capítulos misturadas. Misturar os assuntos treina reconhecer qual ideia cada questão pede, que é o que a prova cobra.</p>

  <div class="config-rev" id="config">
    <label>Capítulos</label>
    <div class="chips" id="chips"></div>
    <label>Quantas questões <select id="qtd"><option value="10">10</option><option value="20">20</option><option value="0">Todas</option></select></label>
    <div class="rev-acoes"><button class="btn primario" id="iniciar">Começar</button></div>
  </div>

  <div class="questao-rev" id="palco" hidden></div>
  <div class="rev-acoes" id="acoes" hidden>
    <button class="btn primario" id="proxima">Próxima</button>
  </div>
</main>
<script src="assets/site.js"></script>
<script src="assets/banco.js"></script>
<script src="assets/estudo.js"></script>
<script>
(function () {
  var S = window.SITE || { capitulos: [] }, B = window.BANCO || { questoes: [] };
  var caps = S.capitulos.filter(function (c) { return B.questoes.some(function (q) { return q.cap === c.id; }); });
  var escolhidos = {};
  var chips = document.getElementById('chips');
  caps.forEach(function (c) {
    escolhidos[c.id] = true;
    var n = B.questoes.filter(function (q) { return q.cap === c.id; }).length;
    var b = document.createElement('button'); b.className = 'on'; b.type = 'button';
    b.textContent = 'Cap. ' + c.numero + ' (' + n + ')';
    b.title = c.titulo;
    b.addEventListener('click', function () { escolhidos[c.id] = !escolhidos[c.id]; b.classList.toggle('on', escolhidos[c.id]); });
    chips.appendChild(b);
  });
  if (!caps.length) { document.getElementById('config').innerHTML = '<p>Ainda não há questões. Prepare um capítulo primeiro.</p>'; return; }

  var palco = document.getElementById('palco'), acoes = document.getElementById('acoes'), btnProx = document.getElementById('proxima');
  var ordem = [], k = 0, placar = {};
  function embaralhar(v) { for (var i = v.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = v[i]; v[i] = v[j]; v[j] = t; } return v; }
  function cap(id) { return S.capitulos.filter(function (c) { return c.id === id; })[0] || { numero: '?', titulo: '', arquivo: '#' }; }

  function mostrar() {
    palco.innerHTML = ''; acoes.hidden = true;
    if (k >= ordem.length) { resultado(); return; }
    var q = ordem[k], c = cap(q.cap);
    var cab = document.createElement('p'); cab.className = 'rev-cabeca';
    cab.textContent = 'Questão ' + (k + 1) + ' de ' + ordem.length;
    palco.appendChild(cab);
    var cont = document.createElement('div'); cont.innerHTML = q.html;
    var quiz = cont.firstElementChild; palco.appendChild(quiz);
    var origem = document.createElement('a'); origem.className = 'ir-passo'; origem.hidden = true;
    origem.href = c.arquivo + '#passo-' + q.passo;
    origem.textContent = 'Rever no Cap. ' + c.numero + ', seção ' + q.secao;
    palco.appendChild(origem);
    ligarQuiz(quiz, function (certa, primeira) {
      if (primeira) {
        placar[q.cap] = placar[q.cap] || { certas: 0, total: 0, erradas: [] };
        placar[q.cap].total++;
        if (certa) placar[q.cap].certas++; else placar[q.cap].erradas.push(q);
      }
      origem.hidden = false; acoes.hidden = false;
      btnProx.textContent = k === ordem.length - 1 ? 'Ver resultado' : 'Próxima';
    });
    tipografar(palco);
  }
  function resultado() {
    var h = '<h2>Resultado</h2><div class="placar">';
    Object.keys(placar).forEach(function (id) {
      var p = placar[id], c = cap(id);
      h += '<div><strong>Cap. ' + c.numero + '</strong> — ' + c.titulo + ': ' + p.certas + ' de ' + p.total + ' de primeira</div>';
    });
    h += '</div>';
    var erradas = [];
    Object.keys(placar).forEach(function (id) { erradas = erradas.concat(placar[id].erradas); });
    if (erradas.length) {
      h += '<p>Vale rever:</p><ul class="resumo-lista">';
      erradas.forEach(function (q) { var c = cap(q.cap); h += '<li><a href="' + c.arquivo + '#passo-' + q.passo + '">Cap. ' + c.numero + ', seção ' + q.secao + '</a></li>'; });
      h += '</ul>';
    } else h += '<p>Tudo certo de primeira.</p>';
    palco.innerHTML = h;
    document.getElementById('config').hidden = false;
    document.getElementById('iniciar').textContent = 'Nova rodada';
  }
  document.getElementById('iniciar').addEventListener('click', function () {
    var pool = B.questoes.filter(function (q) { return escolhidos[q.cap]; });
    if (!pool.length) return;
    var n = +document.getElementById('qtd').value || pool.length;
    ordem = embaralhar(pool.slice()).slice(0, n); k = 0; placar = {};
    document.getElementById('config').hidden = true; palco.hidden = false;
    mostrar(); window.scrollTo({ top: 0 });
  });
  btnProx.addEventListener('click', function () { k++; mostrar(); window.scrollTo({ top: 0 }); });
})();
</script>
</body>
</html>
